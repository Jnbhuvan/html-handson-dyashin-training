<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form HTML Practice</title>
</head>
<body>
    <h1>Survey Form</h1>
    <form action="" method="post">
        <label for="firstname">Name:</label>
        <input type="text" id="firstname" name="firstname" required><br><br>

        <label for="MI">MI:</label>
        <input type="text" id="MI" name="MI" required><br><br>

        <label for="LastName">LastName:</label>
        <input type="text" id="LastName" name="LastName" required><br><br>


        <label for="City">City:</label>
        <input type="text" id="City" name="City" required><br><br>

        <label for="State">State:</label>
        <input type="text" id="State" name="State" required><br><br>

        <label for="ZipCode">ZipCode:</label>
        <input type="text" id="ZipCode" name="ZipCode" required><br><br>


        <p>Sports</p>
        <br>
        BasketBall: <input type="checkbox" name="" id=""> <br>
        Football: <input type="checkbox" name="" id=""> <br>
        Hockey: <input type="checkbox" name="" id="">
        <br>


        Choose a year:
        <br>
        Fresher: <input type="radio" name="" id=""> <br>
        Sophomore: <input type="radio" name="" id=""> <br>
        Junior: <input type="radio" name="" id="">
        Senior:  <input type="radio">
        <br>
        

        <label for="food">Select your fav food</label>
        <select name="" id="food">
            <option value="">Chips</option>
            <option value="">Pizza</option>
            <option value="">Nachos</option>
        </select>

        <br>
        <br>

        <label for="feedback">Feedback Form</label>
        <br>
        <textarea name="" id="feedback"></textarea>

        <br>
        <br>
        <!-- <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>


        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="1" max="120"><br><br> -->

        <input type="submit" name="" id="" value="Send">

        <input type="reset" value="clear">
</body>
</html>
